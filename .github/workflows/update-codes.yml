name: Update Genshin codes

# Обновляет codes.json актуальными промокодами Genshin каждые 6 часов.
# Бесплатно, без Claude и без подписки — работает на серверах GitHub.
on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов (UTC)
  workflow_dispatch: {}       # + кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скачать свежие коды
        run: |
          curl -s --max-time 30 "https://hoyo-codes.seria.moe/codes?game=genshin" -o codes.json
          # страховка: не перезаписываем файл мусором, если API отдал пусто/ошибку
          python3 -c "import json; d=json.load(open('codes.json')); assert d.get('codes'), 'пустой список'; print(len(d['codes']), 'кодов')"

      - name: Закоммитить, если изменилось
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add codes.json
          git diff --staged --quiet || git commit -m "Обновлены промокоды $(date -u +%F_%H:%M) UTC"
          git push
